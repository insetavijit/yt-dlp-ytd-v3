[project]
name = "ytd-dn"
version = "0.1.0"
description = "CLI wrapper around yt-dlp for batch downloading YouTube videos (720p) and audio (MP3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.0",
    "pyyaml>=6.0.3",
    "yt-dlp[default]>=2026.6.9",
]

[project.scripts]
ytd-dn = "ytd_dn.cli:main"
ytd-mp3 = "ytd_dn.mp3:main"
ytd-playlist = "ytd_dn.playlist:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

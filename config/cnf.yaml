# Core Settings
output_dir: /mnt/c/Users/avijit/Downloads/Ytdlp
url_file: ./list.txt
cookie_file: ./cookie.txt

# File Templates
output_template: "%(title)s.%(ext)s"
playlist_dir: "%(playlist_title)s"
playlist_output_template: "%(playlist_index)s-%(title)s.%(ext)s"

# Format & Quality
quality: "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]"
merge_output_format: mp4
audio_format: "bestaudio[ext=m4a][abr<=160]/bestaudio[acodec!=none][vcodec=none][abr<=160]/bestaudio[acodec!=none][vcodec=none]/bestaudio/best[height<=360]/best"

# Network & Resilience
extractor_retries: 5
fragment_retries: 5
match_filter: "!is_live"
concurrent_fragments: 4

# Metadata & Post-Processing
windows_filenames: true
embed_metadata: true
embed_thumbnail: true
convert_thumbnails: jpg
